<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Flujo operativo de crédito</title>
  <desc id="desc">EC, luego Riesgos, luego Liberación para operar el crédito</desc>
  <rect width="1200" height="420" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1152" height="372" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>

  <!-- Node 1: EC -->
  <g transform="translate(100, 90)">
    <rect width="220" height="240" rx="20" fill="#8F9DE2" stroke="#000000" stroke-width="4"/>
    <circle cx="110" cy="88" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <!-- user icon -->
    <circle cx="110" cy="78" r="14" fill="#000000"/>
    <path d="M80 118c8-18 52-18 60 0" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <text x="110" y="168" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#000000">EC</text>
    <text x="110" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000">Ejecutivo de</text>
    <text x="110" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000">Cuenta</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(350, 190)">
    <line x1="0" y1="20" x2="90" y2="20" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <polygon points="90,8 120,20 90,32" fill="#000000"/>
  </g>

  <!-- Node 2: Riesgos -->
  <g transform="translate(490, 90)">
    <rect width="220" height="240" rx="20" fill="#bae6fd" stroke="#000000" stroke-width="4"/>
    <circle cx="110" cy="88" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <!-- scale / shield-ish -->
    <path d="M110 62l22 10v14c0 14-10 26-22 30-12-4-22-16-22-30V72l22-10z" fill="none" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="96" y1="88" x2="124" y2="88" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="168" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#000000">Riesgos</text>
    <text x="110" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000">Dictamen y</text>
    <text x="110" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000">sanción</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(740, 190)">
    <line x1="0" y1="20" x2="90" y2="20" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <polygon points="90,8 120,20 90,32" fill="#000000"/>
  </g>

  <!-- Node 3: Liberación -->
  <g transform="translate(880, 90)">
    <rect width="220" height="240" rx="20" fill="#a7f3d0" stroke="#000000" stroke-width="4"/>
    <circle cx="110" cy="88" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <!-- check / unlock -->
    <circle cx="110" cy="88" r="22" fill="none" stroke="#000000" stroke-width="3.5"/>
    <path d="M98 88l8 8 16-18" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="162" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#000000">Liberación</text>
    <text x="110" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000">para operar</text>
    <text x="110" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000">el crédito</text>
  </g>
</svg>
